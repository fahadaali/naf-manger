name = "naf-manger"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]
main = "worker/index.js"

# النطاق المخصّص: crm.naflaw.sa — وهو ما يُسجَّل في المركز مسارَ استقبالٍ
# كاملاً: https://crm.naflaw.sa/auth/callback
# (ويبقى naf-manger.<الحساب>.workers.dev عاملاً كذلك، ويُطفأ بعد النقل.)
workers_dev = true

# ─────────────────────────────────────────────────────────────
# الأصول الساكنة — بناءُ Vite.
# ─────────────────────────────────────────────────────────────
[assets]
directory = "./dist"
binding = "ASSETS"

# كل مسارٍ لا ملفَّ له يعود `index.html`: اللوحة توجّه نفسها في المتصفّح.
# وهو بديل `public/_redirects` الذي كانت تقرؤه Pages ولا يقرؤه Worker.
not_found_handling = "single-page-application"

# ═══ ولولا هذا السطر لسقطت الحراسة كلُّها ═══
#
# الأصول تُقدَّم قبل الـWorker افتراضاً. فطلبُ `‎/` كان يجد `index.html`
# ويُقدَّم مباشرةً بلا أن يمرّ بالحارس — فلا تحويلة إلى المركز، ويصل
# غيرُ المسجَّل إلى اللوحة ثم تسقط نداءاتُها بـ٤٠١ واحداً واحداً.
#
# وهو فرقٌ جوهري عن Pages: هناك `_middleware.js` يسبق كل طلب بطبعه،
# وهنا يجب أن يُطلب. فيُشغَّل الـWorker أولاً، وهو من ينادي `ASSETS`
# بعد أن يقرّر.
run_worker_first = true

# ─────────────────────────────────────────────────────────────
# متغيّرات غير سرّية. لا سرّ هنا إطلاقاً — السرّ عبر:
#   wrangler secret put AUTH_CLIENT_SECRET
# ─────────────────────────────────────────────────────────────
[vars]
# معرّف هذه المنصة في المركز. يُطابق صفّها في جدول `platforms` هناك،
# ويُشتقّ منه بابُ الدخول: {AUTH_ISSUER}/go/{PLATFORM_ID}.
#
# والقيمة عقدٌ لا اسمٌ للعرض: اختلافُها عن المسجَّل في المركز يُسقط كل دخول،
# ويفشل فشلاً لا يفرّق بينه وبين سرّ خاطئ.
PLATFORM_ID = "naf-manger"

# عنوان المركز. تُقارَن به قيمة `iss` في كل رمز موقّع مقارنةً حرفية،
# ومنه يُبنى عنوان `JWKS`. ونقلُ المركز إلى نطاق مخصّص تعديلُ هذا السطر،
# ومعه `AUTH_ISSUER_PREVIOUS` مدّةَ النقل وحدها ثم يُرفع.
AUTH_ISSUER = "https://app.naflaw.sa"

# دور أول دخول. مفردات الأدوار تخصّ هذه المنصة وحدها — المصادقة مركزية
# والصلاحيات موزّعة — والمركز لا يقرأ هذا الحقل في أي قرار دخول.
#
# وأدوار هذه المنصة `admin` و`lawyer` و`staff` لا `viewer`، و`staff` أدناها
# وهو افتراضُ شاشة المستخدمين اليوم. فتركُ `viewer` هنا كان يُدرج دوراً
# رابعاً لا تعرفه أي شاشة، ولا تُعطيه `getDefaultPermissions` شيئاً.
DEFAULT_ROLE = "staff"

# بريد الآدمن الأول. العضو الذي يحمله يُنشأ بدور `admin` عند أول دخول،
# ومن بعده تُدار العضوية من شاشة المستخدمين كبقية المنصات.
#
# ولا كلمة مرور هنا ولا في هذا المستودع أصلاً: كلمة المرور تخصّ المركز
# وحده — `BOOTSTRAP_ADMIN_PASSWORD` في `naf-id` — والمنصة لا تعرف منها شيئاً.
# والبريد وحده ليس سرّاً، وهو مفتاح المطابقة لا مفتاح الدخول.
BOOTSTRAP_ADMIN_EMAIL = ""

# ─────────────────────────────────────────────────────────────
# قاعدة البيانات — تُنشأ في سير النشر، ويُحقن معرّفها هنا:
#   wrangler d1 create naf-manger
# ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "naf-manger"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# ─────────────────────────────────────────────────────────────
# جلسات المنصة وكاش مفاتيح المركز — تقرؤها naf-auth وحدها:
#   wrangler kv namespace create naf-manger-auth
#
# والاسم `AUTH_KV` عقدٌ مع الحزمة لا خيار: هو افتراضها، وتغييرُه يستلزم
# `AUTH_KV_BINDING` أعلاه. ولا داعي.
# ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "AUTH_KV"
id = "REPLACE_WITH_KV_ID"

# ─────────────────────────────────────────────────────────────
# الملفّات — الصور الشخصية ومرفقات العملاء والقضايا:
#   wrangler r2 bucket create naf-manger-files
#
# واليوم تُخزَّن هذه كلّها سلاسلَ base64 داخل صفوف القاعدة نفسها. وحملُها
# إلى هنا يقع في دفعة طبقة البيانات؛ والحاوية تُربط الآن ومعها مسارُها،
# فلا تنتظر الدفعةُ بنيةً تُنشأ.
# ─────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "FILES"
bucket_name = "naf-manger-files"
