name: Deploy to Cloudflare

# يعمل يدويًا من تبويب Actions، وعند كل دفع إلى main.
on:
  workflow_dispatch:
  push:
    branches: [main]

# ── صلاحيات رمز Cloudflare ──
# السير يلمس أربعة موارد، ولكلٍّ صلاحيته. ورمزٌ ناقصُ واحدةٍ منها يمرّ في
# الخطوات التي يملكها ويسقط عند أوّل ما لا يملك، برسالة
# «Authentication error [code: 10000]» — وهي لا تسمّي المورد ولا الصلاحية،
# فتبدو رمزاً باطلاً وهو صحيح.
#
#   Account · Workers Scripts        · Edit   ← النشر والسرّ
#   Account · Workers KV Storage     · Edit   ← مساحة الجلسات
#   Account · D1                     · Edit   ← القاعدة والهجرات
#   Account · Workers R2 Storage     · Edit   ← حاوية الملفّات
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: naf-manger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── الوصول إلى naf-auth ──
      # ملفّ القفل يحلّ الحزمة عبر `git+ssh` — وهو ما يكتبه npm لاختصار
      # `github:` مهما كان المستودع عامّاً. والعدّاء لا مفتاح ssh له، فيسقط
      # `npm ci` برسالة صلاحيات لا تقول إن العلّة بروتوكولٌ لا إذن.
      #
      # فيُحوَّل الجلب إلى https. والمستودع عامّ فلا رمز يلزم —
      # و`NAF_PACKAGES_TOKEN` يُقرأ إن وُجد ليبقى السير عاملاً لو صار خاصّاً.
      - name: تحويل جلب naf-auth إلى https
        env:
          NAF_PACKAGES_TOKEN: ${{ secrets.NAF_PACKAGES_TOKEN }}
        run: |
          if [ -n "$NAF_PACKAGES_TOKEN" ]; then
            PREFIX="https://x-access-token:${NAF_PACKAGES_TOKEN}@github.com/"
          else
            PREFIX="https://github.com/"
          fi
          git config --global url."$PREFIX".insteadOf "git+ssh://git@github.com/"
          git config --global url."$PREFIX".insteadOf "ssh://git@github.com/"

      - name: تثبيت الاعتماديات
        run: npm ci

      # ── الموارد تُنشأ إن لم تكن، ومعرّفاتها تُحقن في wrangler.toml.
      #    المعرّفات لا تُلتزم في المستودع: السير يكتشفها في كل تشغيل،
      #    فلا نسخة من الملف تختلف عن أخرى.
      #
      #    و`CF_D1_DATABASE_ID` يسبق الاكتشاف حين يُضبط: قاعدةٌ بعينها
      #    تُقصد بمعرّفها لا باسمها، فلا يُنشئ السير قاعدةً ثانية لأن اسماً
      #    لم يطابق. واسمُها يُقرأ من الحساب ويُحقن كذلك — لأن خطوة الهجرة
      #    تنادي بالاسم، فمعرّفٌ لقاعدةٍ باسمٍ آخر يهجّر غيرَ ما ينشر.
      - name: تجهيز قاعدة D1
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          if [ -n "$CF_D1_DATABASE_ID" ]; then
            DB_ID="$CF_D1_DATABASE_ID"
            DB_NAME=$(npx wrangler d1 list --json | jq -r --arg id "$DB_ID" '.[] | select(.uuid==$id) | .name' | head -1)
            [ -n "$DB_NAME" ] && [ "$DB_NAME" != "null" ] \
              || { echo "::error::CF_D1_DATABASE_ID لا يقابل قاعدةً في هذا الحساب: $DB_ID"; exit 1; }
          else
            DB_NAME="naf-manger"
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="naf-manger") | .uuid' | head -1)
            if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
              npx wrangler d1 create naf-manger
              DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="naf-manger") | .uuid' | head -1)
            fi
          fi
          echo "قاعدة D1: $DB_NAME ($DB_ID)"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          sed -i "s|REPLACE_WITH_D1_ID|$DB_ID|" wrangler.toml
          sed -i "s|^database_name = .*|database_name = \"$DB_NAME\"|" wrangler.toml

      - name: تجهيز مساحة KV
        run: |
          KV_ID=$(npx wrangler kv namespace list | jq -r '.[] | select(.title|test("naf-manger-auth$")) | .id' | head -1)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            npx wrangler kv namespace create naf-manger-auth
            KV_ID=$(npx wrangler kv namespace list | jq -r '.[] | select(.title|test("naf-manger-auth$")) | .id' | head -1)
          fi
          echo "مساحة KV: $KV_ID"
          sed -i "s/REPLACE_WITH_KV_ID/$KV_ID/" wrangler.toml

      # `|| true` وحده كان يبتلع كل شيء — ومنه «الرمز لا يملك R2». فتمضي
      # الخطوة خضراء، ثم يسقط النشر بخطأ ارتباطٍ لا يذكر الصلاحيات، بعد
      # خمس خطوات من موضع العطل. فيُفحص النصّ: «قائمة» تُقبل، وما عداها يُردّ.
      - name: تجهيز حاوية R2
        run: |
          OUT=$(npx wrangler r2 bucket create naf-manger-files 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qiE "already (exists|owned)|10004"; then
            echo "الحاوية قائمة."
          elif echo "$OUT" | grep -qiE "Authentication error|10000|not authorized"; then
            echo "::error::الرمز لا يملك صلاحية R2 — أضف «Workers R2 Storage: Edit»."; exit 1
          elif echo "$OUT" | grep -q "✘"; then
            echo "::error::تعذّر تجهيز حاوية R2."; exit 1
          fi

      # ── بريد الآدمن الأول ──
      # يُحقن من أسرار المستودع ولا يُكتب في ملفّ متتبَّع: بريدُ شخصٍ بعينه
      # لا يبقى في git إلى الأبد. وهو ليس سرّاً يحرس شيئاً — لا يُدخل أحداً
      # ولا يمنعه — لكنّ إبقاءه خارج المستودع أنظف.
      #
      # وغيابُه لا يُسقط النشر: المنصة تعمل، ولا آدمن فيها. فيُنبَّه ولا يُفشل.
      - name: حقن بريد الآدمن الأول
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
        run: |
          if [ -z "$BOOTSTRAP_ADMIN_EMAIL" ]; then
            echo "::warning::لا BOOTSTRAP_ADMIN_EMAIL — لن يُنشأ آدمن، وكل داخل يأخذ staff."
          fi
          node -e '
            const fs = require("fs");
            const email = process.env.BOOTSTRAP_ADMIN_EMAIL || "";
            const file = "wrangler.toml";
            const next = fs.readFileSync(file, "utf8").replace(
              /^BOOTSTRAP_ADMIN_EMAIL = .*$/m,
              "BOOTSTRAP_ADMIN_EMAIL = " + JSON.stringify(email),
            );
            fs.writeFileSync(file, next);
          '
          grep -q "^BOOTSTRAP_ADMIN_EMAIL = " wrangler.toml \
            || { echo "::error::لم يُحقن البريد — تغيّر شكل السطر في wrangler.toml."; exit 1; }

      # الهجرات للأمام فقط، وتطبيقها آمن للتكرار: wrangler يتتبّع المطبَّق.
      # والاسم من الخطوة أعلاه لا مكتوباً هنا، فالهجرة تصيب ما يُنشر.
      - name: تطبيق الهجرات
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote

      # ── متغيّرات البناء ──
      # `Vite` يحقن ما بدأ بـ`VITE_` **وقت البناء** لا وقت التشغيل: يُدرجه
      # في الحزمة نصّاً. فلا ينفع فيه `wrangler secret` — ذاك يصل العامل
      # ولا يصل المتصفّح.
      #
      # وغيابُها لا يُسقط الصفحة بعد اليوم — العميل صار يُنشأ عند أول
      # استعمال — لكنه يُعطّل شاشات البيانات. فيُنبَّه ولا يُفشل.
      #
      # ومفتاح `ANON` ليس سرّاً في حقيقته: يُشحن في الحزمة ويقرؤه كل زائر،
      # وحارسُه سياساتُ الصفوف في Supabase لا خفاؤه.
      - name: البناء
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ] \
            || echo "::warning::لا إعداد Supabase — التطبيق يعمل والدخول يعمل، وشاشات البيانات تُخفق."
          npm run build

      # ── النشر يسبق السرّ، ولا بدّ ──
      # `wrangler secret put` يشترط وجود الـWorker: على عاملٍ لم يُنشر بعد
      # يسأل «أأنشئه؟» — سؤالٌ لا مجيب له في عدّاءٍ بلا طرفية. فالترتيب
      # هنا معكوسٌ عمّا كان في Pages، وهو ما تفرضه المنصة لا اختيارٌ.
      #
      # ووضعُ السرّ بعد النشر ينفذ فوراً: تغييرُ سرٍّ يُصدر نسخةً جديدة من
      # العامل نفسه، فلا ينتظر نشرةً تالية.
      - name: النشر
        run: npx wrangler deploy

      # ── سرّ المنصة ──
      # يُحمل من أسرار المستودع إن وُجد. واختياريٌّ: من وضعه بـ
      # `wrangler secret put` مرّةً لا يحتاجه، والخطوة تمرّ.
      #
      # ولا يُطبع ولا يُمرَّر في سطر أوامر: يدخل من المجرى القياسي، فلا
      # يظهر في `ps` ولا في سجلّ التشغيل.
      #
      # والفحص في الصدفة لا في `if:` — سياق `secrets` لا يُقرأ في شرط خطوة،
      # ووجودُه هناك خطأُ تحقّقٍ يردّ الملفّ كلَّه قبل أن تُنشأ وظيفة واحدة:
      # يظهر تشغيلاً فاشلاً بلا وظائف ولا سجلّ، ولا يقول أين العطل.
      - name: حمل سرّ المنصة
        env:
          AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$AUTH_CLIENT_SECRET" ]; then
            echo "لا سرّ في أسرار المستودع — يُتوقَّع أنه مضبوط على العامل مباشرةً."
            exit 0
          fi
          printf '%s' "$AUTH_CLIENT_SECRET" | npx wrangler secret put AUTH_CLIENT_SECRET

      # ── بوابة السرّ ──
      # الدخول كلّه يقف عليه، وغيابُه لا يظهر إلا عند أول مبادلة: يفشل
      # الدخول برسالة لا تفرّق بين سرٍّ غائب وسرٍّ خاطئ. فيُفحص هنا صراحةً.
      - name: التحقق من وجود سرّ المنصة
        run: |
          npx wrangler secret list | grep -q AUTH_CLIENT_SECRET \
            || { echo "::error::لا سرّ: wrangler secret put AUTH_CLIENT_SECRET"; exit 1; }
